<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerenciador de Tarefas — Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #2c3e50;
      font-size: 28px;
    }

    .subtitulo {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    /* ── Auth Card ─────────────────────────────────── */
    .auth-card {
      background: #fff;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 0 auto 30px;
    }

    .auth-card h2 { margin-bottom: 18px; color: #2c3e50; font-size: 20px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 8px; border: 1px solid #ddd;
      background: #f9f9f9; color: #555; border-radius: 6px;
      cursor: pointer; font-size: 14px; transition: all .15s;
    }
    .tab-btn.active { background: #3498db; border-color: #3498db; color: #fff; font-weight: bold; }

    .auth-card input {
      width: 100%; padding: 10px 14px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 15px;
    }
    .auth-card input:focus { outline: none; border-color: #3498db; }

    .auth-card button.btn-principal {
      width: 100%; padding: 12px; background: #3498db;
      color: #fff; border: none; border-radius: 6px;
      font-size: 16px; cursor: pointer; transition: background .2s;
    }
    .auth-card button.btn-principal:hover { background: #2980b9; }

    /* ── Mensagens ──────────────────────────────────── */
    .msg { font-size: 13px; margin-top: 10px; padding: 8px 12px; border-radius: 6px; }
    .msg.erro    { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c6; }
    .msg.sucesso { background: #eafaf1; color: #27ae60; border: 1px solid #a9dfbf; }

    /* ── Header do app ──────────────────────────────── */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .info-usuario { font-size: 14px; color: #777; }
    .info-usuario strong { color: #2c3e50; }

    .btn-sair {
      padding: 7px 16px; background: #fff; border: 1px solid #ddd;
      border-radius: 6px; color: #e74c3c; cursor: pointer; font-size: 13px;
      transition: background .15s;
    }
    .btn-sair:hover { background: #fdecea; }

    /* ── Formulário de nova tarefa ───────────────────── */
    .formulario {
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .formulario h2 { margin-bottom: 16px; font-size: 18px; color: #555; }

    .formulario input,
    .formulario textarea {
      width: 100%; padding: 10px 14px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 15px;
    }
    .formulario input:focus,
    .formulario textarea:focus { outline: none; border-color: #3498db; }

    .formulario textarea { height: 80px; resize: none; }

    .formulario button {
      width: 100%; padding: 12px; background: #3498db;
      color: #fff; border: none; border-radius: 6px;
      font-size: 16px; cursor: pointer; transition: background .2s;
    }
    .formulario button:hover { background: #2980b9; }

    /* ── Lista de tarefas ───────────────────────────── */
    #lista-tarefas { display: flex; flex-direction: column; gap: 14px; }

    .tarefa {
      background: #fff;
      border-left: 5px solid #3498db;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      transition: opacity .2s;
    }

    .tarefa.concluida { border-left-color: #2ecc71; opacity: .75; }
    .tarefa.concluida h3 { text-decoration: line-through; color: #999; }

    .tarefa-info h3 { font-size: 16px; margin-bottom: 4px; }
    .tarefa-info p  { font-size: 14px; color: #777; margin-bottom: 6px; }
    .status         { font-size: 13px; color: #555; }

    .tarefa-acoes { display: flex; flex-direction: column; gap: 8px; margin-left: 16px; }

    .btn-concluir, .btn-excluir {
      padding: 7px 14px; border: none; border-radius: 5px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .btn-concluir { background: #2ecc71; color: #fff; }
    .btn-concluir:hover { background: #27ae60; }
    .btn-excluir  { background: #e74c3c; color: #fff; }
    .btn-excluir:hover  { background: #c0392b; }

    .vazia { text-align: center; color: #aaa; font-size: 15px; padding: 20px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="container">

  <h1>📋 Gerenciador de Tarefas</h1>
  <p class="subtitulo">Campus Limoeiro do Norte — IFCE</p>

  <!-- ══ SEÇÃO DE AUTENTICAÇÃO ══════════════════════ -->
  <div id="secao-auth">
    <div class="auth-card">
      <div class="tabs">
        <button class="tab-btn active" onclick="mostrarAba('login')">Entrar</button>
        <button class="tab-btn"        onclick="mostrarAba('registro')">Registrar</button>
      </div>

      <!-- Login -->
      <div id="aba-login">
        <input type="email"    id="login-email" placeholder="E-mail" />
        <input type="password" id="login-senha" placeholder="Senha" />
        <button class="btn-principal" onclick="fazerLogin()">Entrar</button>
        <div id="msg-login"></div>
      </div>

      <!-- Registro -->
      <div id="aba-registro" class="hidden">
        <input type="text"     id="reg-nome"  placeholder="Seu nome" />
        <input type="email"    id="reg-email" placeholder="E-mail" />
        <input type="password" id="reg-senha" placeholder="Senha (mín. 6 caracteres)" />
        <button class="btn-principal" onclick="fazerRegistro()">Criar conta</button>
        <div id="msg-registro"></div>
      </div>
    </div>
  </div>

  <!-- ══ SEÇÃO DO APP (pós-login) ══════════════════ -->
  <div id="secao-app" class="hidden">

    <div class="app-header">
      <div class="info-usuario">
        Olá, <strong id="nome-usuario"></strong>
      </div>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>

    <!-- Formulário — igual ao projeto MVC original -->
    <div class="formulario">
      <h2>Nova Tarefa</h2>
      <input type="text"     id="titulo"   placeholder="Título da tarefa" />
      <textarea              id="descricao" placeholder="Descrição (opcional)"></textarea>
      <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
    </div>

    <!-- Lista — mesma estrutura visual do projeto MVC original -->
    <div id="lista-tarefas"></div>

  </div>
</div>

<script>
  // ── Estado ────────────────────────────────────────────────────────────────
  let token   = localStorage.getItem('token');
  let usuario = JSON.parse(localStorage.getItem('usuario') || 'null');

  if (token && usuario) mostrarApp();

  // ── Abas de auth ──────────────────────────────────────────────────────────
  function mostrarAba(aba) {
    document.getElementById('aba-login').classList.toggle('hidden',    aba !== 'login');
    document.getElementById('aba-registro').classList.toggle('hidden', aba !== 'registro');
    document.querySelectorAll('.tab-btn').forEach((b, i) =>
      b.classList.toggle('active', (i === 0 && aba === 'login') || (i === 1 && aba === 'registro'))
    );
  }

  // ── Registro ──────────────────────────────────────────────────────────────
  async function fazerRegistro() {
    const nome  = document.getElementById('reg-nome').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const senha = document.getElementById('reg-senha').value;
    const msgEl = document.getElementById('msg-registro');

    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nome, email, password: senha })
      });
      const data = await res.json();
      if (!res.ok) return exibirMsg(msgEl, data.error, 'erro');
      salvarSessao(data.token, data.user);
      exibirMsg(msgEl, data.message, 'sucesso');
      setTimeout(mostrarApp, 700);
    } catch { exibirMsg(msgEl, 'Erro de conexão.', 'erro'); }
  }

  // ── Login ──────────────────────────────────────────────────────────────────
  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const msgEl = document.getElementById('msg-login');

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: senha })
      });
      const data = await res.json();
      if (!res.ok) return exibirMsg(msgEl, data.error, 'erro');
      salvarSessao(data.token, data.user);
      exibirMsg(msgEl, data.message, 'sucesso');
      setTimeout(mostrarApp, 600);
    } catch { exibirMsg(msgEl, 'Erro de conexão.', 'erro'); }
  }

  // ── Logout ────────────────────────────────────────────────────────────────
  function fazerLogout() {
    localStorage.removeItem('token');
    localStorage.removeItem('usuario');
    token = null; usuario = null;
    document.getElementById('secao-app').classList.add('hidden');
    document.getElementById('secao-auth').classList.remove('hidden');
  }

  // ── Tarefas ───────────────────────────────────────────────────────────────
  async function carregarTarefas() {
    const res  = await fetch('/api/tasks', { headers: cabecalho() });
    const data = await res.json();
    if (res.ok) renderizarTarefas(data.tasks);
  }

  async function adicionarTarefa() {
    const titulo    = document.getElementById('titulo').value.trim();
    const descricao = document.getElementById('descricao').value.trim();

    if (!titulo) { alert('O título é obrigatório!'); return; }

    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: { ...cabecalho(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: titulo, description: descricao })
    });
    if (res.ok) {
      document.getElementById('titulo').value    = '';
      document.getElementById('descricao').value = '';
      carregarTarefas();
    }
  }

  async function alternarConcluida(id) {
    await fetch(`/api/tasks/${id}/toggle`, { method: 'PATCH', headers: cabecalho() });
    carregarTarefas();
  }

  async function excluirTarefa(id) {
    if (!confirm('Deseja excluir esta tarefa?')) return;
    await fetch(`/api/tasks/${id}`, { method: 'DELETE', headers: cabecalho() });
    carregarTarefas();
  }

  // ── Renderização (mesma estrutura visual do projeto MVC original) ─────────
  function renderizarTarefas(tarefas) {
    const lista = document.getElementById('lista-tarefas');
    lista.innerHTML = '';

    if (!tarefas.length) {
      lista.innerHTML = '<p class="vazia">Nenhuma tarefa cadastrada.</p>';
      return;
    }

    tarefas.forEach(tarefa => {
      const item = document.createElement('div');
      item.className = 'tarefa' + (tarefa.completed ? ' concluida' : '');
      item.innerHTML = `
        <div class="tarefa-info">
          <h3>${escapar(tarefa.title)}</h3>
          <p>${escapar(tarefa.description || '')}</p>
          <span class="status">${tarefa.completed ? 'Concluida' : '🕐 Pendente'}</span>
        </div>
        <div class="tarefa-acoes">
          <button onclick="alternarConcluida(${tarefa.id})" class="btn-concluir">
            ${tarefa.completed ? 'Reabrir' : 'Concluir'}
          </button>
          <button onclick="excluirTarefa(${tarefa.id})" class="btn-excluir">Excluir</button>
        </div>`;
      lista.appendChild(item);
    });
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function mostrarApp() {
    document.getElementById('secao-auth').classList.add('hidden');
    document.getElementById('secao-app').classList.remove('hidden');
    document.getElementById('nome-usuario').textContent = usuario.name;
    carregarTarefas();
  }

  function salvarSessao(t, u) {
    token = t; usuario = u;
    localStorage.setItem('token',   t);
    localStorage.setItem('usuario', JSON.stringify(u));
  }

  function cabecalho() { return { 'Authorization': `Bearer ${token}` }; }

  function exibirMsg(el, texto, tipo) {
    el.innerHTML = `<div class="msg ${tipo}">${escapar(texto)}</div>`;
  }

  function escapar(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Enter nos campos
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-senha') ?.addEventListener('keydown', e => { if (e.key==='Enter') fazerLogin(); });
    document.getElementById('reg-senha')   ?.addEventListener('keydown', e => { if (e.key==='Enter') fazerRegistro(); });
    document.getElementById('titulo')      ?.addEventListener('keydown', e => { if (e.key==='Enter') adicionarTarefa(); });
  });
</script>
</body>
</html>
